name: Publish to PyPI

# Triggered on a semver tag push (e.g. v0.1.0). The `ci` job calls
# the package's CI workflow as a reusable workflow. That workflow verifies the
# tag, builds wheel/sdist once, and installs that wheel from the run artifact.
# Publish uses the same artifact only after all tag CI checks pass. No API token.
#
# Trusted publisher binding on PyPI:
#   project:     kestrel-cloud-gcp
#   owner:       KestrelSovereignAI
#   repository:  kestrel-cloud-gcp
#   workflow:    publish.yml
#   environment: pypi

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Upload to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gcp-distributions-${{ github.sha }}
          path: dist/

      - name: Publish via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
